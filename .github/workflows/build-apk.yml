name: Build Zoryvo APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Re-sign with stable temporary key
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/zoryvo-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/zoryvo-testkey.x509.pem
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --key /tmp/zoryvo-testkey.pk8 \
            --cert /tmp/zoryvo-testkey.x509.pem \
            --out /tmp/Zoryvo.apk \
            "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs /tmp/Zoryvo.apk

      - name: Verify APK identity
        run: |
          set -euo pipefail
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging /tmp/Zoryvo.apk | tee /tmp/badging.txt
          grep -q "package: name='com.zoryvo.hub' versionCode='1'" /tmp/badging.txt
          grep -q "application-label:'Zoryvo'" /tmp/badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Zoryvo-APK
          path: /tmp/Zoryvo.apk
          if-no-files-found: error

      - name: Publish stable Zoryvo download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hub-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/Zoryvo.apk --clobber
            gh release edit "$TAG" --title "Zoryvo" --notes "Temporary Android app hub." --latest
          else
            gh release create "$TAG" /tmp/Zoryvo.apk \
              --title "Zoryvo" \
              --notes "Temporary Android app hub." \
              --latest
          fi
