name: Build Zoryvo APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Re-sign with stable temporary key
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/zoryvo-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/zoryvo-testkey.x509.pem
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --key /tmp/zoryvo-testkey.pk8 --cert /tmp/zoryvo-testkey.x509.pem --out /tmp/Zoryvo.apk "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs /tmp/Zoryvo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zoryvo-APK
          path: /tmp/Zoryvo.apk
          if-no-files-found: error
